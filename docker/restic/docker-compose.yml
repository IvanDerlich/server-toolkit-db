services:
  restic:
    image: restic/restic:${RESTIC_IMAGE_TAG:?RESTIC_IMAGE_TAG is required}
    container_name: ${RESTIC_CONTAINER_NAME:?RESTIC_CONTAINER_NAME is required}
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    user: "${RESTIC_UID:?RESTIC_UID is required}:${RESTIC_GID:?RESTIC_GID is required}"
    restart: "no"
    environment:
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?RESTIC_REPOSITORY is required}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?RESTIC_PASSWORD is required}
      TZ: ${TZ:?TZ is required}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?AWS_ACCESS_KEY_ID is required}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?AWS_SECRET_ACCESS_KEY is required}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:?AWS_DEFAULT_REGION is required}
      AWS_ENDPOINT_URL: ${AWS_ENDPOINT_URL:?AWS_ENDPOINT_URL is required}
    volumes:
      - ${RESTIC_SOURCE_PATH:?RESTIC_SOURCE_PATH is required}:/data:ro
    command: ["backup", "/data"]