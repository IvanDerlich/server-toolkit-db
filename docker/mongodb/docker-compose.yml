services:
  mongodb:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MONGODB_IMAGE_TAG: ${MONGODB_IMAGE_TAG:?MONGODB_IMAGE_TAG is required}
    image: mongodb-hardened:${MONGODB_IMAGE_TAG:?MONGODB_IMAGE_TAG is required}
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    # Run MongoDB as non-root; values come from .env.
    user: "${MONGODB_UID:?MONGODB_UID is required}:${MONGODB_GID:?MONGODB_GID is required}"
    container_name: ${MONGODB_CONTAINER_NAME:?MONGODB_CONTAINER_NAME is required}
    restart: unless-stopped
    ports:
      - "${MONGODB_HOST_PORT:?MONGODB_HOST_PORT is required}:27017"
    environment:
      # Consumed by image/entrypoint.sh during first-run bootstrap.
      MONGODB_ROOT_USERNAME: ${MONGODB_ROOT_USERNAME:?MONGODB_ROOT_USERNAME is required}
      MONGODB_ROOT_PASSWORD: ${MONGODB_ROOT_PASSWORD:?MONGODB_ROOT_PASSWORD is required}
      MONGODB_APP_DATABASE: ${MONGODB_APP_DATABASE:?MONGODB_APP_DATABASE is required}
      MONGODB_APP_USERNAME: ${MONGODB_APP_USERNAME:?MONGODB_APP_USERNAME is required}
      MONGODB_APP_PASSWORD: ${MONGODB_APP_PASSWORD:?MONGODB_APP_PASSWORD is required}
    volumes:
      - mongodb_data:/data/db
      # TLS artifacts are generated by scripts/start.sh before compose up.
      - ./.generated/tls:/etc/mongo/tls:ro
    healthcheck:
      test: ["CMD", "/etc/mongo/scripts/container-readiness.sh"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mongodb_data:
    name: ${MONGODB_VOLUME_NAME:?MONGODB_VOLUME_NAME is required}