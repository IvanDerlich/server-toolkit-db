services:
  mariadb:
    build:
      context: .
      dockerfile: Dockerfile
    user: "999:999"
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    container_name: ${MARIADB_CONTAINER_NAME:?MARIADB_CONTAINER_NAME is required}
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?MARIADB_ROOT_PASSWORD is required}
      MARIADB_DATABASE: ${MARIADB_DATABASE:?MARIADB_DATABASE is required}
      MARIADB_USER: ${MARIADB_USER:?MARIADB_USER is required}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?MARIADB_PASSWORD is required}
    ports:
      - "${MARIADB_BIND_ADDRESS:?MARIADB_BIND_ADDRESS is required}:${MARIADB_PORT:?MARIADB_PORT is required}:3306"
      - "[::]:${MARIADB_PORT:?MARIADB_PORT is required}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mariadb_data:
    name: ${MARIADB_VOLUME_NAME:?MARIADB_VOLUME_NAME is required}
